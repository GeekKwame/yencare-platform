services:
  - type: web
    name: yencare-api-staging
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      - key: SMS_PROVIDER
        value: mnotify
      - key: MNOTIFY_SENDER_ID
        value: YenCare
      - key: MONGODB_URI
        sync: false
      - key: MNOTIFY_API_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: https://yencare-platform.vercel.app
      - key: CORS_ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: MONGO_MIN_POOL_SIZE
        value: "10"
      - key: MONGO_MAX_POOL_SIZE
        value: "50"
