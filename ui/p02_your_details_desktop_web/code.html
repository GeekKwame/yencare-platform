<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>

      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-border": "#000000",
                    "inverse-on-surface": "#f1f1f1",
                    "surface": "#f9f9f9",

                    "on-primary-fixed": "#1b1b1b",
                    "primary-fixed": "#e2e2e2",
                    "tertiary": "#000000",
                    "placeholder": "#999999",
                    "secondary-container": "#e1dfdf",
                    "on-secondary-fixed-variant": "#464747",
                    "surface-low": "#F2F2F2",
                    "inverse-surface": "#303030",
                    "surface-high": "#FFFFFF",
                    "error-text": "#000000",
                    "on-tertiary-container": "#848484",
                    "on-secondary-fixed": "#1b1c1c",
                    "on-secondary": "#ffffff",
                    "on-surface": "#1b1b1b",
                    "surface-container": "#eeeeee",
                    "inverse-primary": "#c6c6c6",
                    "surface-container-lowest": "#ffffff",
                    "primary": "#000000",

                    "on-primary": "#ffffff",

                    "surface-container-low": "#f3f3f3",
                    "surface-variant": "#e2e2e2",
                    "on-background": "#1b1b1b",
                    "error-container": "#ffdad6",
                    "outline-variant": "#cfc4c5",
                    "tertiary-container": "#1b1b1b",
                    "tertiary-fixed-dim": "#c6c6c6",
                    "primary-fixed-dim": "#c6c6c6",
                    "secondary-fixed": "#e4e2e2",
                    "on-primary-fixed-variant": "#474747",
                    "on-tertiary-fixed": "#1b1b1b",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#626262",
                    "background": "#f9f9f9",
                    "on-tertiary-fixed-variant": "#474747",
                    "on-surface-variant": "#4c4546",
                    "secondary": "#5e5e5e",
                    "on-primary-container": "#848484",
                    "outline": "#7e7576",
                    "secondary-fixed-dim": "#c7c6c6",
                    "surface-dim": "#dadada",
                    "surface-container-highest": "#e2e2e2",
                    "primary-container": "#1b1b1b",
                    "surface-bright": "#f9f9f9",
                    "on-error": "#ffffff"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "base": "8px",
                    "gutter-mobile": "16px",
                    "margin-mobile": "20px",
                    "gutter-desktop": "24px",
                    "margin-desktop": "64px",

            },
            "fontFamily": {
                    "headline-md": ["Hanken Grotesk"],
                    "body-lg": ["Hanken Grotesk"],
                    "label-sm": ["Hanken Grotesk"],
                    "label-md": ["Hanken Grotesk"],

                    "label-sm": ["12px", {"lineHeight": "16px", "fontWeight": "500"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600"}],
                    "headline-lg": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                    "queue-hero": ["72px", {"lineHeight": "80px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "headline-lg-mobile": ["28px", {"lineHeight": "36px", "fontWeight": "700"}],
                    "reference-code": ["24px", {"lineHeight": "32px", "letterSpacing": "0.1em", "fontWeight": "700"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]

          },
        },
      }

<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-background');
        }
        /* Custom focus ring to match clinical minimalism */
        .input-focus-ring:focus-within {
            outline: 2px solid theme('colors.surface-border');
            outline-offset: -1px;
        }
    </style>
</head>
<body class="antialiased min-h-screen flex flex-col">
<!-- TopAppBar (Patient Facing - based on JSON logic but adapted for this specific prompt's layout request) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-gutter-desktop h-20 bg-surface dark:bg-background border-b border-surface-border">
<div class="flex items-center gap-2">
<span aria-hidden="true" class="material-symbols-outlined text-primary dark:text-on-background text-[24px]" data-icon="medical_services" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-headline-md text-headline-md text-primary dark:text-on-background">YɛnCare</span>
</div>
<!-- Desktop Nav Links -->
<nav class="hidden md:flex items-center gap-8">
<a class="font-label-md text-label-md text-primary dark:text-on-background active:scale-95 duration-100 border-b-2 border-primary pb-1" href="#">Book appointment</a>
<a class="font-label-md text-label-md text-secondary dark:text-on-surface-variant hover:bg-surface-container-low transition-colors px-3 py-2 rounded-DEFAULT active:scale-95 duration-100" href="#">Find appointment</a>
</nav>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex items-center justify-center pt-20 px-gutter-mobile md:px-gutter-desktop">
<!-- Form Container (Clinical Minimalism: Max Width 560px, Brutalist Borders) -->
<div class="w-full max-w-[480px] bg-surface-high border border-surface-border p-8 md:p-10 shadow-sm mt-12 mb-12">
<div class="mb-8">
<p class="font-label-md text-label-md text-secondary mb-2 uppercase tracking-wider">Step 1 of 3</p>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Your Details</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Please provide your contact information to begin booking.</p>
</div>
<form action="#" class="space-y-6" method="POST">
<!-- Full Name Field -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="fullName">Full Name</label>
<div class="input-focus-ring border border-surface-border bg-surface-high rounded-none transition-shadow">
<input class="w-full bg-transparent border-none font-body-lg text-body-lg text-primary placeholder:text-placeholder focus:ring-0 py-3 px-4" id="fullName" name="fullName" placeholder="e.g. Kwame Mensah" required="" type="text"/>
</div>
</div>
<!-- Phone Number Field with Prefix -->
<div>
<label class="block font-label-md text-label-md text-primary mb-2" for="phoneNumber">Phone Number</label>
<div class="flex input-focus-ring border border-surface-border bg-surface-high rounded-none transition-shadow">
<div class="flex items-center justify-center bg-surface-low border-r border-surface-border px-4 py-3">
<span class="font-body-lg text-body-lg text-primary font-medium">+233</span>
</div>
<input class="flex-1 bg-transparent border-none font-body-lg text-body-lg text-primary placeholder:text-placeholder focus:ring-0 py-3 px-4" id="phoneNumber" name="phoneNumber" pattern="[0-9]*" placeholder="24 123 4567" required="" type="tel"/>
</div>
<p class="mt-2 font-label-sm text-label-sm text-on-surface-variant">We'll use this to send your booking reference.</p>
</div>
<!-- Spacer -->
<div class="h-4"></div>
<!-- Continue Button -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-6 rounded-none hover:bg-surface-tint active:scale-[0.98] transition-all flex items-center justify-center gap-2 group" type="submit">
<span>Continue</span>
<span class="material-symbols-outlined group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Secure notice -->
<div class="mt-8 pt-6 border-t border-surface-border flex items-center gap-2 justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-[16px]" data-icon="lock">lock</span>
<span class="font-label-sm text-label-sm">Your information is secure and encrypted</span>
</div>
</div>
</main>
<script>
        // Simple client-side validation logic for UX enhancement
        document.querySelector('form').addEventListener('submit', function(e) {
            const phoneInput = document.getElementById('phoneNumber');
            // Basic check for Ghana phone numbers (usually 9 digits after country code in local format without leading 0)
            const cleanPhone = phoneInput.value.replace(/\D/g, '');
            if(cleanPhone.length > 0 && cleanPhone.length < 9) {
                e.preventDefault();
                // Change border to error state
                phoneInput.parentElement.classList.remove('border-surface-border');
                phoneInput.parentElement.classList.add('border-error', 'border-2');
                phoneInput.parentElement.previousElementSibling.classList.add('text-error');
            } else {
                phoneInput.parentElement.classList.add('border-surface-border');
                phoneInput.parentElement.classList.remove('border-error', 'border-2');
                phoneInput.parentElement.previousElementSibling.classList.remove('text-error');
            }
        });

        // Format phone number input slightly for readability
        document.getElementById('phoneNumber').addEventListener('input', function(e) {
            let val = e.target.value.replace(/\D/g, '');
            if (val.length > 2) {
                val = val.substring(0, 2) + ' ' + val.substring(2);
            }
            if (val.length > 6) {
                val = val.substring(0, 6) + ' ' + val.substring(6, 10);
            }
            e.target.value = val;
        });
    </script>
</body></html>
