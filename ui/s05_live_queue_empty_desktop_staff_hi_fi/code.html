<!DOCTYPE html>

<html class="h-full" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>YɛnCare - Live Queue</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "error-container": "#ffdad6",
                        "background": "#f9f9f9",
                        "outline-variant": "#cfc4c5",
                        "surface-container-highest": "#e2e2e2",
                        "on-primary": "#ffffff",
                        "secondary-container": "#e1dfdf",
                        "on-tertiary-fixed-variant": "#474747",
                        "on-secondary-container": "#626262",
                        "surface-variant": "#e2e2e2",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#c7c6c6",
                        "on-surface": "#1b1b1b",
                        "primary": "#000000",
                        "primary-fixed": "#e2e2e2",
                        "outline": "#7e7576",
                        "on-error": "#ffffff",
                        "on-tertiary-container": "#848484",
                        "error-text": "#000000",
                        "primary-container": "#1b1b1b",
                        "surface-border": "#000000",
                        "on-secondary-fixed": "#1b1c1c",
                        "on-primary-fixed": "#1b1b1b",
                        "on-surface-variant": "#4c4546",
                        "tertiary-fixed": "#e2e2e2",
                        "surface-container": "#eeeeee",
                        "tertiary-container": "#1b1b1b",
                        "inverse-surface": "#303030",
                        "tertiary-fixed-dim": "#c6c6c6",
                        "surface-container-low": "#f3f3f3",
                        "surface-container-high": "#e8e8e8",
                        "secondary-fixed": "#e4e2e2",
                        "on-error-container": "#93000a",
                        "secondary": "#5e5e5e",
                        "on-secondary": "#ffffff",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed-dim": "#c6c6c6",
                        "surface-bright": "#f9f9f9",
                        "surface-low": "#F2F2F2",
                        "on-background": "#1b1b1b",
                        "inverse-primary": "#c6c6c6",
                        "on-primary-fixed-variant": "#474747",
                        "on-tertiary-fixed": "#1b1b1b",
                        "tertiary": "#000000",
                        "surface-tint": "#5e5e5e",
                        "surface-high": "#FFFFFF",
                        "surface-dim": "#dadada",
                        "placeholder": "#999999",
                        "inverse-on-surface": "#f1f1f1",
                        "on-primary-container": "#848484",
                        "on-secondary-fixed-variant": "#464747",
                        "surface": "#f9f9f9",
                        "on-tertiary": "#ffffff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "margin-mobile": "20px",
                        "gutter-desktop": "24px",
                        "base": "8px",
                        "max-width-form": "560px",
                        "margin-desktop": "64px",
                        "gutter-mobile": "16px"
                    },
                    "fontFamily": {
                        "queue-hero": ["Hanken Grotesk"],
                        "reference-code": ["Hanken Grotesk"],
                        "body-lg": ["Hanken Grotesk"],
                        "headline-md": ["Hanken Grotesk"],
                        "body-md": ["Hanken Grotesk"],
                        "headline-lg": ["Hanken Grotesk"],
                        "headline-lg-mobile": ["Hanken Grotesk"],
                        "label-sm": ["Hanken Grotesk"],
                        "label-md": ["Hanken Grotesk"]
                    },
                    "fontSize": {
                        "queue-hero": ["72px", { "lineHeight": "80px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "reference-code": ["24px", { "lineHeight": "32px", "letterSpacing": "0.1em", "fontWeight": "700" }],
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "700" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "700" }],
                        "label-sm": ["12px", { "lineHeight": "16px", "fontWeight": "500" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.01em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface h-full flex antialiased">
<!-- SideNavBar (Staff Desktop) -->
<nav class="bg-surface-container-low text-primary hidden md:flex flex-col h-screen py-base gap-2 fixed left-0 top-0 h-full w-60 border-r border-outline-variant z-40">
<div class="px-4 py-6 mb-4">
<h1 class="text-headline-md font-headline-md font-bold text-primary mb-1">Staff Portal</h1>
<p class="text-label-sm font-label-sm text-on-surface-variant">YɛnCare Health</p>
</div>
<div class="flex-1 flex flex-col gap-1 px-2">
<a class="flex items-center gap-3 text-on-surface-variant px-4 py-3 hover:bg-surface-variant transition-colors rounded-lg text-label-md font-label-md" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">today</span>
                Today
            </a>
<a class="flex items-center gap-3 text-on-surface-variant px-4 py-3 hover:bg-surface-variant transition-colors rounded-lg text-label-md font-label-md" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">calendar_today</span>
                Appointments
            </a>
<!-- Active State for Queue -->
<a class="flex items-center gap-3 bg-secondary-container text-on-secondary-container rounded-lg px-4 py-3 opacity-80 transition-all duration-200 scale-95 text-label-md font-label-md" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">format_list_numbered</span>
                Queue
            </a>
</div>
<div class="px-2 mt-auto">
<a class="flex items-center gap-3 text-on-surface-variant px-4 py-3 hover:bg-surface-variant transition-colors rounded-lg text-label-md font-label-md" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">settings</span>
                Settings
            </a>
<a class="flex items-center gap-3 text-on-surface-variant px-4 py-3 hover:bg-surface-variant transition-colors rounded-lg text-label-md font-label-md" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">logout</span>
                Sign Out
            </a>
</div>
</nav>
<!-- Main Content Area -->
<main class="flex-1 flex flex-col ml-0 md:ml-60 h-screen overflow-hidden">
<!-- Top App Bar (Mobile Only - Replaces Sidebar on mobile) -->
<header class="bg-surface text-primary flex justify-between items-center w-full px-margin-mobile py-4 border-b border-outline-variant md:hidden z-30">
<div class="text-headline-md font-headline-md font-bold text-primary">YɛnCare</div>
<button class="text-on-surface-variant">
<span class="material-symbols-outlined">menu</span>
</button>
</header>
<!-- Page Header -->
<div class="px-margin-mobile md:px-margin-desktop py-8 md:py-12 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
<div>
<h2 class="text-headline-lg font-headline-lg md:text-headline-lg md:font-headline-lg text-primary">Live Queue</h2>
<p class="text-body-md font-body-md text-on-surface-variant mt-1">Manage active patient flow.</p>
</div>
<div class="flex gap-3">
<button class="border border-surface-border bg-surface-high text-primary px-4 py-2 text-label-md font-label-md hover:bg-surface-container transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-sm">refresh</span> Refresh
                </button>
</div>
</div>
<!-- Empty State Canvas -->
<div class="flex-1 px-margin-mobile md:px-margin-desktop pb-12 flex items-center justify-center">
<div class="w-full max-w-2xl bg-surface-low border border-surface-border p-12 flex flex-col items-center text-center">
<div class="w-24 h-24 rounded-full bg-surface-container flex items-center justify-center mb-6 border border-outline-variant">
<span class="material-symbols-outlined text-[48px] text-on-surface-variant" style="font-variation-settings: 'FILL' 0;">inbox</span>
</div>
<h3 class="text-headline-md font-headline-md text-primary mb-2">No patients in the queue</h3>
<p class="text-body-lg font-body-lg text-on-surface-variant max-w-md mx-auto mb-8">
                    The waiting room is currently clear. New check-ins will appear here automatically.
                </p>
<div class="flex flex-col sm:flex-row gap-4 w-full sm:w-auto">
<button class="bg-primary text-on-primary px-6 py-3 border border-surface-border text-label-md font-label-md hover:opacity-90 transition-opacity w-full sm:w-auto min-w-[120px]">
                        Check In Patient
                    </button>
</div>
</div>
</div>
</main>
</body></html>
