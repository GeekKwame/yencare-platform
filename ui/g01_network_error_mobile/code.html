<body class="bg-background text-on-background h-full flex flex-col items-center justify-center font-body-md">
<!-- TopAppBar suppressed due to transactional/error intent -->
<main class="flex-1 w-full max-w-max-width-form mx-auto px-margin-mobile flex flex-col justify-center items-center text-center">
<!-- Error Icon Container -->
<div class="mb-8 p-4 rounded-full border-2 border-surface-border bg-surface-high flex items-center justify-center w-24 h-24">
<span class="material-symbols-outlined text-[48px] text-error-text" style="font-variation-settings: 'FILL' 1;">
                wifi_off
            </span>
</div>
<!-- Error Messaging -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-4">
            Connection Lost
        </h1>
<p class="font-body-lg text-body-lg text-secondary mb-12 max-w-[400px]">
            No internet. Check your connection and try again.
        </p>
<!-- Primary Action -->
<button class="w-full bg-primary text-on-primary font-label-md text-label-md py-4 px-8 border border-surface-border hover:bg-surface-container-low hover:text-primary transition-colors active:scale-95 flex items-center justify-center gap-2 rounded-DEFAULT min-h-[44px]">
<span class="material-symbols-outlined text-[20px]">refresh</span>
            Try again
        </button>
<!-- Secondary Context (Optional) -->
<div class="mt-8 pt-8 border-t border-surface-border w-full">
<p class="font-label-sm text-label-sm text-placeholder text-center">
                Error Code: G01 Global Network Error
            </p>
</div>
</main>
<!-- BottomNavBar / NavigationDrawer suppressed due to transactional/error intent -->
<script>
        // Simple reload logic for the 'Try again' button
        document.querySelector('button').addEventListener('click', () => {
            const btn = document.querySelector('button');
            const originalText = btn.innerHTML;
            
            // Loading state
            btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">sync</span> Checking...`;
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            
            // Simulate network check delay
            setTimeout(() => {
                // Reset (in a real app, this would redirect or refresh data if successful)
                btn.innerHTML = originalText;
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                
                // Show a simple toast indicating failure persists (for prototype sake)
                const toast = document.createElement('div');
                toast.className = 'fixed bottom-4 left-4 right-4 md:left-1/2 md:transform md:-translate-x-1/2 md:w-[400px] bg-primary text-on-primary p-4 border border-surface-border font-label-md text-label-md flex items-center gap-2 z-50';
                toast.innerHTML = `<span class="material-symbols-outlined">error</span> Still unable to connect.`;
                document.body.appendChild(toast);
                
                setTimeout(() => toast.remove(), 3000);
            }, 1500);
        });
    </script>
