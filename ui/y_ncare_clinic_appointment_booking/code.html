<style>
        body {
            font-family: 'Hanken Grotesk', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        
        .clinical-input {
            width: 100%;
            border: 1px solid #000000;
            background-color: #FFFFFF;
            padding: 12px 16px;
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 16px;
            line-height: 24px;
            font-weight: 400;
            color: #1b1b1b;
            transition: all 0.2s ease;
        }

        .clinical-input:focus {
            outline: none;
            border-width: 2px;
            padding: 11px 15px; /* Adjust padding to maintain dimensions */
        }
        
        .clinical-input::placeholder {
            color: #999999;
        }

        .phone-prefix {
            display: flex;
            align-items: center;
            border: 1px solid #000000;
            border-right: none;
            background-color: #F2F2F2;
            padding: 0 16px;
            font-family: 'Hanken Grotesk', sans-serif;
            font-size: 16px;
            font-weight: 600;
            color: #1b1b1b;
        }

        .phone-input-container {
            display: flex;
            width: 100%;
        }

        .phone-input-container .clinical-input {
            border-left: 1px solid #000000; /* Restore left border for input next to prefix */
        }
        
        .phone-input-container:focus-within .clinical-input {
            border-width: 2px;
            padding: 11px 15px;
        }
        
        .phone-input-container:focus-within .phone-prefix {
             border-width: 2px;
             border-right: none;
             padding: 0 15px;
        }
    </style>
</head>
<body class="bg-background text-on-background antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar from JSON, transaction/linear intent, so navigation is suppressed but structure remains -->
<header class="bg-white dark:bg-background text-primary dark:text-on-background font-label-md text-label-md w-full sticky top-0 z-50 border-b border-surface-border">
<div class="flex justify-between items-center px-margin-desktop py-4 max-w-full mx-auto">
<div class="text-headline-md font-headline-md font-bold text-primary dark:text-on-background">YɛnCare</div>
<div class="flex items-center gap-4 hidden md:flex">
<!-- Navigation suppressed as this is a linear flow -->
</div>
<div class="flex items-center gap-4">
<button class="text-secondary hover:text-primary transition-colors font-label-md text-label-md">Sign in</button>
<button class="bg-primary text-on-primary border border-primary px-4 py-2 font-label-md text-label-md hover:bg-surface-container-low hover:text-primary transition-colors active:opacity-80">Check-in</button>
</div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-grow flex items-center justify-center py-12 px-margin-mobile md:px-margin-desktop">
<!-- Centered Form Container -->
<div class="w-full max-w-[480px] bg-surface-high border border-surface-border p-8 md:p-12 flex flex-col gap-8">
<!-- Header section -->
<div class="flex flex-col gap-2 border-b border-surface-border pb-6">
<h1 class="font-headline-lg text-headline-lg text-on-surface m-0 p-0">Your Details</h1>
<p class="font-body-md text-body-md text-secondary m-0 p-0">Please provide your contact information to secure your spot in the queue.</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault(); window.location.href='#';">
<!-- Full Name Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="fullName">Full Name</label>
<input class="clinical-input" id="fullName" name="fullName" placeholder="e.g. Kwame Mensah" required="" type="text"/>
</div>
<!-- Phone Number Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-on-surface" for="phoneNumber">Phone Number</label>
<div class="phone-input-container">
<span class="phone-prefix">+233</span>
<input class="clinical-input" id="phoneNumber" name="phoneNumber" pattern="[0-9]{2} [0-9]{3} [0-9]{4}" placeholder="24 123 4567" required="" type="tel"/>
</div>
<p class="font-label-sm text-label-sm text-secondary mt-1 flex items-center gap-1">
<span class="material-symbols-outlined" style="font-size: 14px;">info</span>
                        Used to send a confirmation text.
                    </p>
</div>
<!-- Actions -->
<div class="mt-4 pt-6 border-t border-surface-border flex justify-end">
<button class="bg-primary text-on-primary border border-primary px-8 py-3 font-label-md text-label-md w-full md:w-auto hover:bg-surface-container-low hover:text-primary transition-colors active:opacity-80" type="submit">Continue</button>
</div>
</form>

<script>
        // Simple script to format phone number input for UX
        const phoneInput = document.getElementById('phoneNumber');
        if(phoneInput) {
            phoneInput.addEventListener('input', function (e) {
                let x = e.target.value.replace(/\D/g, '').match(/(\d{0,2})(\d{0,3})(\d{0,4})/);
                e.target.value = !x[2] ? x[1] : x[1] + ' ' + x[2] + (x[3] ? ' ' + x[3] : '');
            });
        }
    </script>
