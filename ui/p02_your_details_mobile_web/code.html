<label class="font-label-md text-label-md text-on-surface mb-2" for="fullName">Full Name</label>

</div>
<!-- Phone Field with Prefix -->

<label class="font-label-md text-label-md text-on-surface mb-2" for="phoneNumber">Phone Number</label>
<div class="flex">
<span class="inline-flex items-center px-4 bg-surface-low border border-r-0 border-surface-border rounded-l-DEFAULT font-body-md text-body-md text-secondary select-none">

</div>

<span class="material-symbols-outlined text-[16px] mr-1" data-icon="info">info</span>
