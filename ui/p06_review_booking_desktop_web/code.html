</div>
<div class="flex flex-col gap-1 border-b border-surface-variant pb-4">
<span class="font-label-sm text-label-sm text-secondary uppercase tracking-wider">Phone Number</span>

</div>
<div class="flex flex-col gap-1 border-b border-surface-variant pb-4">

</div>

<span class="font-body-lg text-body-lg text-primary">Oct 24, 2023</span>
</div>

</div>
