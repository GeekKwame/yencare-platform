<button aria-label="Close modal" class="text-secondary hover:text-on-surface transition-colors focus:outline-none focus:ring-2 focus:ring-surface-border">

</button>
</header>

<div>

<p class="font-body-md text-body-md text-secondary">This time will be given to someone else.</p>
</div>

<div class="bg-surface border border-surface-border p-4 rounded-DEFAULT flex flex-col gap-2">
<div class="flex items-center gap-2 text-on-surface">

</div>

</div>
</div>
</div>
