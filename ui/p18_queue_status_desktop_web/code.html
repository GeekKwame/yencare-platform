<body class="h-full flex flex-col font-body-md text-on-background antialiased selection:bg-surface-border selection:text-white">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-desktop h-20 bg-surface border-b-2 border-surface-border">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined text-3xl" style="font-variation-settings: 'FILL' 1;">medical_services</span>
<span class="font-headline-md text-headline-md tracking-tight">YɛnCare</span>
</div>
<nav class="hidden md:flex items-center gap-6">
<a class="flex items-center gap-2 px-4 py-2 border-2 border-transparent hover:border-surface-border rounded-DEFAULT transition-all" href="#">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-label-md text-label-md uppercase">Book appointment</span>
</a>
<a class="flex items-center gap-2 px-4 py-2 border-2 border-transparent hover:border-surface-border rounded-DEFAULT transition-all" href="#">
<span class="material-symbols-outlined">search</span>
<span class="font-label-md text-label-md uppercase">Find appointment</span>
</a>
</nav>
</header>
<!-- Main Content -->
<main class="flex-grow flex items-center justify-center pt-20 px-4 md:px-margin-desktop bg-background">
<!-- Queue Status Container -->
<div class="w-full max-w-max-width-form bg-surface-high border-2 border-surface-border rounded-lg p-8 md:p-12 shadow-[8px_8px_0px_0px_rgba(0,0,0,1)] transition-transform hover:-translate-y-1 hover:shadow-[12px_12px_0px_0px_rgba(0,0,0,1)]">
<div class="flex flex-col items-center text-center">
<!-- Status Badge -->
<div class="inline-flex items-center gap-2 px-4 py-2 border border-surface-border bg-surface-low rounded-full mb-8">
<span class="material-symbols-outlined text-primary text-xl">schedule</span>
<span class="font-label-md text-label-md uppercase tracking-wider text-primary">Checked In</span>
</div>
<h1 class="font-headline-lg text-headline-lg mb-2">You are number</h1>
<!-- Queue Hero Number -->
<div class="font-queue-hero text-queue-hero text-primary my-6 py-8 px-16 border-y-2 border-surface-border w-full flex justify-center bg-surface-low">
                    4
                </div>
<div class="space-y-4 mb-10 w-full">
<div class="flex justify-between items-center py-3 border-b border-surface-variant">
<span class="font-body-lg text-body-lg text-secondary">Estimated Wait Time</span>
<span class="font-headline-md text-headline-md text-primary">~15 mins</span>
</div>
<div class="flex justify-between items-center py-3 border-b border-surface-variant">
<span class="font-body-lg text-body-lg text-secondary">Current Token Served</span>
<span class="font-headline-md text-headline-md text-primary">#1</span>
</div>
</div>
<!-- Primary Action -->
<button class="w-full flex items-center justify-center gap-3 bg-primary text-on-primary py-4 px-6 rounded-DEFAULT border-2 border-primary hover:bg-surface-high hover:text-primary transition-colors group">
<span class="material-symbols-outlined group-hover:rotate-180 transition-transform duration-500">refresh</span>
<span class="font-label-md text-label-md uppercase tracking-wider">Refresh Status</span>
</button>
</div>
</div>
</main>
<!-- BottomNavBar (Hidden on Desktop) -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex md:hidden justify-around items-center px-4 pb-4 pt-2 bg-surface-high border-t border-surface-border">
<a class="flex flex-col items-center justify-center text-secondary px-6 py-1 hover:bg-surface-container-high rounded-lg transition-colors" href="#">
<span class="material-symbols-outlined">add_circle</span>
<span class="font-label-sm text-label-sm mt-1">Book</span>
</a>
