        /* Pulse animation for the called state */
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .pulse-element {
            position: relative;
        }
        .pulse-element::before {
            content: '';
            position: absolute;
            inset: -20px;
            border-radius: 50%;
            background-color: theme('colors.primary');
            opacity: 0;
            z-index: -1;
            animation: pulse-ring 2s infinite cubic-bezier(0.215, 0.61, 0.355, 1);

<!-- Vibrate API trigger script (conceptual for mobile feedback) -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Attempt to trigger a haptic pulse if supported to reinforce the 'Called' state
            if ("vibrate" in navigator) {
                // Short double pulse: vibrate(ms), pause(ms), vibrate(ms)
                navigator.vibrate([200, 100, 200]);
            }
        });
