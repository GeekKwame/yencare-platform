</div>

<h3 class="font-label-md text-label-md text-secondary mb-3 uppercase tracking-wider">Morning</h3>

<button class="py-3 px-2 border border-surface-border rounded bg-surface-container-lowest text-on-surface font-body-md text-body-md hover:bg-surface-container-high transition-colors text-center focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent">08:30 AM</button>
