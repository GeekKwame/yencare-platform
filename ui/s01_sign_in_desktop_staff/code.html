<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>

<title>Staff Sign In - YɛnCare</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "tertiary": "#000000",

                        "surface-container-highest": "#e2e2e2",
                        "on-secondary-fixed-variant": "#464747",

                        "primary-fixed-dim": "#c6c6c6",
                        "surface-tint": "#5e5e5e",
                        "surface": "#f9f9f9",
                        "surface-container-lowest": "#ffffff",

                    "spacing": {

<style>
        @import url('https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Hanken Grotesk', sans-serif;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex items-center justify-center p-margin-mobile md:p-margin-desktop">
<!-- Main Sign In Container -->
<div class="w-full max-w-[400px] bg-surface-high border border-surface-border p-8 rounded-DEFAULT">
<!-- Header -->
<div class="flex flex-col items-center mb-8 text-center">
<div class="w-16 h-16 bg-surface-container border border-surface-border flex items-center justify-center mb-6 rounded-DEFAULT">
<span class="material-symbols-outlined text-[32px] text-primary" data-icon="medical_services" data-weight="fill">medical_services</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-primary mb-2">Staff Sign In</h1>
<p class="font-body-md text-body-md text-secondary">Access the YɛnCare clinical portal</p>
</div>
<!-- Form -->
<form class="flex flex-col gap-6" onsubmit="event.preventDefault(); document.getElementById('signin-btn').innerText = 'Signing in...';">
<!-- Username Input -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-label-md text-primary" for="username">Username</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary pointer-events-none" data-icon="person">person</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-high border border-surface-border rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-placeholder focus:outline-none focus:border-2 focus:border-primary transition-all" id="username" name="username" placeholder="Enter your staff ID" required="" type="text"/>
</div>
</div>
<!-- Password Input -->
<div class="flex flex-col gap-2">
<div class="flex items-center justify-between">
<label class="font-label-md text-label-md text-primary" for="password">Password</label>
<a class="font-label-sm text-label-sm text-secondary hover:text-primary transition-colors underline" href="#">Forgot password?</a>
</div>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-3 text-secondary pointer-events-none" data-icon="lock">lock</span>
<input class="w-full pl-10 pr-3 py-3 bg-surface-high border border-surface-border rounded-DEFAULT font-body-md text-body-md text-on-surface placeholder:text-placeholder focus:outline-none focus:border-2 focus:border-primary transition-all" id="password" name="password" placeholder="Enter your password" required="" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full mt-2 py-4 bg-primary text-on-primary font-label-md text-label-md text-center flex justify-center items-center gap-2 border border-surface-border rounded-DEFAULT hover:bg-inverse-surface transition-colors active:scale-[0.98]" id="signin-btn" type="submit">
                Sign in
                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<!-- Footer Info -->
<div class="mt-8 text-center border-t border-surface-container pt-6">
<p class="font-label-sm text-label-sm text-secondary">
                For technical support, contact the IT department.
            </p>
</div>
</div>
</body></html>
