<body class="bg-surface dark:bg-background text-on-surface font-body-md h-screen flex flex-col antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-margin-mobile h-16 bg-surface dark:bg-background border-b border-surface-border">
<button aria-label="Go back" class="flex items-center justify-center p-2 -ml-2 text-primary dark:text-on-background active:scale-95 duration-100 hover:bg-surface-container-low transition-colors rounded-full">

</button>
<h1 class="font-headline-md text-headline-md text-primary dark:text-on-background absolute left-1/2 transform -translate-x-1/2">YɛnCare</h1>

<header class="mb-8">

<p class="font-body-lg text-body-lg text-secondary">Select an available time slot for your appointment.</p>
</header>
<div class="space-y-8">
<!-- Morning Group -->
<section>
<h3 class="font-label-md text-label-md text-secondary mb-4 uppercase tracking-wider">Morning</h3>
<div class="grid grid-cols-3 gap-base">
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95">08:00</button>
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95">08:30</button>
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95 opacity-50 cursor-not-allowed" disabled="">09:00</button>
<button class="py-3 px-2 border-2 border-primary rounded-DEFAULT font-label-md text-label-md text-on-primary bg-primary transition-colors active:scale-95">09:30</button>
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95">10:00</button>
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95">10:30</button>
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95">11:00</button>
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95 opacity-50 cursor-not-allowed" disabled="">11:30</button>
</div>
</section>
<!-- Afternoon Group -->
<section>
<h3 class="font-label-md text-label-md text-secondary mb-4 uppercase tracking-wider">Afternoon</h3>
<div class="grid grid-cols-3 gap-base">
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95">12:00</button>
<button class="py-3 px-2 border border-surface-border rounded-DEFAULT font-label-md text-label-md text-primary bg-surface-high hover:bg-surface-container-low transition-colors active:scale-95 opacity-50 cursor-not-allowed" disabled="">12:30</button>
